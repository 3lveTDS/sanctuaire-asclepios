<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanctuaire d'Asclépios</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --panel: #1e1e1e;
      --text: #ffffff;
      --muted: #bbbbbb;
      --border: #000;
      --inactive: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }


    #list {
      width: 100%;
      padding: 8px;
      font-size: 0.9em;
      border-radius: 6px;
      border: 1px solid #000;
      background-color: #3A3A3C;
      color: #ffffff;
    }

    #list:hover {
      background-color: #48484a;
    }


    #app {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
    }

    #controls {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 800px;
      flex-wrap: wrap;
      min-height: 42px;
    }

    #list {
      width: 220px;
      flex: 0 0 220px;
      height: 42px;
    }

    #level-buttons {
      display: flex;
      align-items: stretch;
      gap: 8px;
      flex-wrap: wrap;
    }

    #level-buttons button {
      width: 52px;
      height: 42px;
      padding: 0;
      font-size: 0.9em;
      border-radius: 6px;
      border: 1px solid #000;
      background-color: #2178FE;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #level-buttons button:hover {
      background-color: #2178FE;
    }

    .btn {
      background-color: var(--panel);
      color: var(--text);
      border: 1px solid #666;
      border-radius: 6px;
      font-size: 0.85rem;
      padding: 8px;
      cursor: pointer;
      width: 100%;
    }

    .btn:hover {
      border-color: #aaa;
    }

    #canvas {
      position: relative;
      width: 800px;
      height: 800px;
      background: #ffffff;
      border: 1px solid #000;
      border-radius: 12px;
      overflow: hidden;
    }

    #sanctuary-svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .decor {
      opacity: 0.95;
      pointer-events: none;
    }

    .dot {
      stroke: #000;
      stroke-width: 0.5;
      fill: #ffffff;
      cursor: pointer;
      transition: fill 0.25s ease, filter 0.25s ease, transform 0.25s ease;
      transform-box: fill-box;
      transform-origin: center;
    }

    .dot:hover {
      filter: brightness(1.15);
    }

    .dot.pulse {
      animation: pulse 0.55s ease-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      45% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }
  </style>
</head>

      // Progress display removed.
    }

    function applyColor(index) {
      const level = state[index] || 0;
      dots[index].style.fill = levels[level];
    }

    function pulse(index) {
      dots[index].classList.remove("pulse");
      void dots[index].getBoundingClientRect();
      dots[index].classList.add("pulse");
      setTimeout(() => dots[index].classList.remove("pulse"), 550);
    }

    function cycleItem(index) {
      state[index] = ((state[index] || 0) + 1) % levels.length;
      applyColor(index);
      pulse(index);
      localStorage.setItem("asclepiosState", JSON.stringify(state));
      updateProgress();
    }

    function resetAll() {
      if (!confirm("Réinitialiser tous les progrès ?")) return;
      for (let i = 1; i <= N; i++) {
        state[i] = 0;
        applyColor(i);
      }
      localStorage.setItem("asclepiosState", JSON.stringify(state));
      updateProgress();
    }

    svg.appendChild(decorGroup);

    positions.forEach((pos, zeroBasedIndex) => {

      const rect = document.createElementNS(SVG_NS, "rect");
      rect.setAttribute("x", pos.x);
      rect.setAttribute("y", pos.y);
      rect.setAttribute("width", 5);
      rect.setAttribute("height", 5);
      rect.setAttribute("rx", 0.4);
      rect.setAttribute("class", "dot");
      rect.dataset.index = index;
      rect.addEventListener("click", () => cycleItem(index));
      rect.appendChild(document.createElementNS(SVG_NS, "title")).textContent = `Item ${index}`;
      svg.appendChild(rect);
      dots[index] = rect;
      applyColor(index);
    });

      const option = document.createElement("option");
      option.value = i;
      option.textContent = `Item ${i}`;
      list.appendChild(option);
    }

    let selectedItem = null;

    list.addEventListener("change", (e) => {
      selectedItem = parseInt(e.target.value);
    });


    document.querySelectorAll("#level-buttons button").forEach((button) => {
      button.addEventListener("click", () => {
        if (!selectedItem) return;

        const level = parseInt(button.dataset.level);
        state[selectedItem] = level;

        dots[selectedItem].style.fill = levels[level];
        dots[selectedItem].classList.add("pulse");
        setTimeout(() => dots[selectedItem].classList.remove("pulse"), 600);

        localStorage.setItem("asclepiosState", JSON.stringify(state));
        updateProgress();
      });
    });

    updateProgress();
